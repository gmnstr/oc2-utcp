# SDK drift early warning.
#
# Purpose: src/mcp-no-retry.ts overrides private methods of @utcp/mcp (1.2.0):
# `_withSession` (stops the double-execution retry) and `_dereferenceSchema`
# (blocks file/http $ref reads). package.json pins @utcp/{sdk,http,mcp} exactly,
# so an upstream release cannot break CI until someone upgrades the pin. This
# workflow runs the shim's behavioural tests against the LATEST published
# @utcp/sdk, @utcp/http and @utcp/mcp, so the break shows up on a schedule.
#
# A red run means the shim no longer matches upstream. Adapt src/mcp-no-retry.ts
# (and its tests) before upgrading the exact pins in package.json.
#
# This workflow never modifies the repository. The upgrade happens only in the
# ephemeral runner's working copy: `bun add --no-save` does not write
# package.json or the lockfile, and nothing is committed or pushed.

name: SDK drift

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: shim contract tests against latest @utcp
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runner-only upgrade: --no-save leaves package.json and bun.lock untouched.
      - name: Upgrade @utcp packages to latest (runner copy only)
        run: bun add --no-save @utcp/sdk@latest @utcp/http@latest @utcp/mcp@latest

      - name: Print resolved @utcp versions
        run: bun pm ls

      - name: Typecheck against latest @utcp
        run: bun run typecheck

      - name: Shim contract tests against latest @utcp
        run: bun test test/mcp-*.test.ts
